# Пример внешнего nginx на сервере (Ubuntu/Debian).
# Скопируйте в /etc/nginx/sites-available/pantech и включите сайт.
#
# Docker должен слушать ТОЛЬКО localhost (см. docker-compose.yml):
#   WEB_PUBLISH_PORT=5173  →  127.0.0.1:5173:80
#
# Проверка после деплоя:
#   curl -s http://127.0.0.1:5173/api/health

server {
    listen 80;
    server_name pan-tech.ru www.pan-tech.ru;

    # Редирект на HTTPS (раскомментируйте после настройки certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

