services:
  web:
    build:
      context: frontend
      network: host
    ports:
      - "${WEB_PUBLISH_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - docker_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      network: host
      args:
        FASTAPI_PORT: ${FASTAPI_PORT:-8080}
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pantech_db}}
      RUN_SEED: ${RUN_SEED:-1}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${FASTAPI_PORT:-8080}"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - docker_network
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER_NAME:-pantech_postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pantech_db}
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pantech_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - docker_network
    restart: unless-stopped

networks:
  docker_network:
    name: docker_network

volumes:
  postgres_data:
