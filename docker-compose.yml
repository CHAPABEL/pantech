services:
  web:
    build:
      context: frontend
    ports:
      # nginx внутри контейнера слушает 80. На сервере биндим localhost:5173 — внешний nginx проксирует сюда.
      - "127.0.0.1:${WEB_PUBLISH_PORT:-5173}:80"
    environment:
      NGINX_PORT: 80
      BACKEND_HOST: backend
      BACKEND_PORT: ${FASTAPI_PORT:-8080}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docker_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        FASTAPI_PORT: ${FASTAPI_PORT:-8080}
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pantech_db}
      RUN_SEED: ${RUN_SEED:-1}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "${FASTAPI_PORT:-8080}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('FASTAPI_PORT', '8080') + '/api/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - docker_network
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER_NAME:-pantech_postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pantech_db}
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pantech_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - docker_network
    restart: unless-stopped

networks:
  docker_network:
    name: docker_network

volumes:
  postgres_data:
